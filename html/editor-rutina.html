<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Editor de rutina — App de Entrenamiento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container app-container flex-wrap">
      <a href="dashboard.html" class="navbar-brand">&larr; Hoy</a>
      <div class="d-flex align-items-center gap-3">
        <a href="historial.html" class="link-light small">Historial</a>
        <a href="progreso.html" class="link-light small">Progreso</a>
        <button class="btn btn-sm btn-outline-light" id="btn-logout">Salir</button>
      </div>
    </div>
  </nav>

  <div class="app-container">
    <h2 class="h4 mb-3">Editor de rutina</h2>

    <div class="alert alert-danger d-none" id="mensaje-error" role="alert"></div>

    <div class="card mb-4">
      <div class="card-header">Catálogo de ejercicios</div>
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2 mb-3" id="filtro-grupo-muscular"></div>
        <ul class="list-group list-group-flush mb-3" id="lista-catalogo"></ul>
        <form id="form-nuevo-ejercicio" class="row g-2 align-items-end">
          <div class="col-12 col-md-4">
            <label class="form-label small">Nombre</label>
            <input type="text" class="form-control form-control-sm" id="nuevo-ej-nombre" required>
          </div>
          <div class="col-6 col-md-4">
            <label class="form-label small">Grupo muscular</label>
            <input type="text" class="form-control form-control-sm" id="nuevo-ej-grupo" required>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label small">Tipo</label>
            <select class="form-select form-select-sm" id="nuevo-ej-tipo">
              <option value="fuerza">Fuerza</option>
              <option value="cardio">Cardio</option>
              <option value="pliometria">Pliometría</option>
            </select>
          </div>
          <div class="col-12 col-md-1">
            <button type="submit" class="btn btn-sm btn-outline-primary w-100">+</button>
          </div>
        </form>
      </div>
    </div>

    <div id="lista-dias"></div>
  </div>

  <template id="template-fila-ejercicio">
    <div class="rde-row">
      <div class="rde-field rde-name nombre-ejercicio"></div>
      <div class="rde-field"><span class="rde-label">Series</span><input type="number" step="1" min="0" class="form-control form-control-sm input-sets"></div>
      <div class="rde-field"><span class="rde-label">Reps min</span><input type="number" step="1" min="0" class="form-control form-control-sm input-reps-min"></div>
      <div class="rde-field"><span class="rde-label">Reps max</span><input type="number" step="1" min="0" class="form-control form-control-sm input-reps-max"></div>
      <div class="rde-field"><span class="rde-label">Duración (min)</span><input type="number" step="1" min="0" class="form-control form-control-sm input-duracion"></div>
      <div class="rde-field"><span class="rde-label">Orden</span><input type="number" step="1" min="1" class="form-control form-control-sm input-orden"></div>
      <div class="rde-field"><span class="rde-label">Notas</span><input type="text" class="form-control form-control-sm input-notas"></div>
      <div class="rde-actions">
        <button type="button" class="btn btn-sm btn-outline-secondary btn-guardar-fila">Guardar</button>
        <button type="button" class="btn btn-sm btn-outline-danger btn-eliminar-fila">Eliminar</button>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/routine-data.js"></script>
  <script src="../js/editor-rutina.js"></script>
</body>
</html>
