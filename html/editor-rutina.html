<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Editor de rutina — App de Entrenamiento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <script>
    (function () {
      try {
        var tema = localStorage.getItem('pref-tema');
        var tamano = localStorage.getItem('pref-tamano-letra');
        if (tema === 'light') document.documentElement.setAttribute('data-theme', 'light');
        if (tamano && tamano !== 'medium') document.documentElement.setAttribute('data-font-size', tamano);
        document.documentElement.style.colorScheme = tema === 'light' ? 'light' : 'dark';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="app-topbar"><span class="app-topbar-title">Editor de rutina</span></header>

  <div class="app-container">
    <div class="alert alert-danger d-none" id="mensaje-error" role="alert"></div>

    <div class="card mb-4">
      <div class="card-header">Mis rutinas</div>
      <div class="card-body">
        <ul class="list-group list-group-flush mb-3" id="lista-rutinas"></ul>
        <form id="form-nueva-rutina" class="row g-2 align-items-end">
          <div class="col-8 col-md-9">
            <label class="form-label small">Nueva rutina</label>
            <input type="text" class="form-control form-control-sm" id="nueva-rutina-nombre" placeholder="Nombre de la rutina" required>
          </div>
          <div class="col-4 col-md-3">
            <button type="submit" class="btn btn-sm btn-outline-primary w-100">Crear</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header">Catálogo de ejercicios</div>
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2 mb-3" id="filtro-grupo-muscular"></div>
        <ul class="list-group list-group-flush mb-3" id="lista-catalogo"></ul>
        <form id="form-nuevo-ejercicio" class="row g-2 align-items-end">
          <div class="col-12 col-md-4">
            <label class="form-label small">Nombre</label>
            <input type="text" class="form-control form-control-sm" id="nuevo-ej-nombre" required>
          </div>
          <div class="col-6 col-md-4">
            <label class="form-label small">Grupo muscular</label>
            <input type="text" class="form-control form-control-sm" id="nuevo-ej-grupo" required>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label small">Tipo</label>
            <select class="form-select form-select-sm" id="nuevo-ej-tipo">
              <option value="fuerza">Fuerza</option>
              <option value="cardio">Cardio</option>
              <option value="pliometria">Pliometría</option>
            </select>
          </div>
          <div class="col-12 col-md-1">
            <button type="submit" class="btn btn-sm btn-outline-primary w-100">+</button>
          </div>
        </form>
      </div>
    </div>

    <datalist id="datalist-catalogo"></datalist>

    <h2 class="h5 mb-3" id="titulo-rutina-seleccionada"></h2>
    <div id="lista-dias"></div>
    <div id="agregar-dia-container"></div>
  </div>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <a href="dashboard.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9v6M4 8v8M18 9v6M20 8v8M8 12h8"/></svg>
      <span>Hoy</span>
    </a>
    <a href="historial.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
      <span>Historial</span>
    </a>
    <a href="editor-rutina.html" class="bottom-nav-item activo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h2M9 6h11M4 12h2M9 12h11M4 18h2M9 18h11"/></svg>
      <span>Rutina</span>
    </a>
    <a href="progreso.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      <span>Progreso</span>
    </a>
    <a href="perfil.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.5-4 4.2-6 7-6s5.5 2 7 6"/></svg>
      <span>Perfil</span>
    </a>
  </nav>

  <template id="template-fila-ejercicio">
    <div class="rde-row">
      <div class="rde-field rde-name nombre-ejercicio"></div>
      <div class="rde-field"><span class="rde-label">Series</span><input type="number" step="1" min="0" class="form-control form-control-sm input-sets"></div>
      <div class="rde-field"><span class="rde-label">Reps min</span><input type="number" step="1" min="0" class="form-control form-control-sm input-reps-min"></div>
      <div class="rde-field"><span class="rde-label">Reps max</span><input type="number" step="1" min="0" class="form-control form-control-sm input-reps-max"></div>
      <div class="rde-field"><span class="rde-label">Duración (min)</span><input type="number" step="1" min="0" class="form-control form-control-sm input-duracion"></div>
      <div class="rde-field"><span class="rde-label">Orden</span><input type="number" step="1" min="1" class="form-control form-control-sm input-orden"></div>
      <div class="rde-field"><span class="rde-label">Notas</span><input type="text" class="form-control form-control-sm input-notas"></div>
      <div class="rde-actions">
        <button type="button" class="btn btn-sm btn-outline-secondary btn-guardar-fila">Guardar</button>
        <button type="button" class="btn btn-sm btn-outline-danger btn-eliminar-fila">Eliminar</button>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/routine-data.js"></script>
  <script src="../js/editor-rutina.js"></script>
</body>
</html>
