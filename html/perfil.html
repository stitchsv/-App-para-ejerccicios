<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Perfil — App de Entrenamiento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <script>
    (function () {
      try {
        var tema = localStorage.getItem('pref-tema');
        var tamano = localStorage.getItem('pref-tamano-letra');
        if (tema === 'light') document.documentElement.setAttribute('data-theme', 'light');
        if (tamano && tamano !== 'medium') document.documentElement.setAttribute('data-font-size', tamano);
        document.documentElement.style.colorScheme = tema === 'light' ? 'light' : 'dark';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="app-topbar"><span class="app-topbar-title">Perfil</span></header>

  <div class="app-container">
    <div class="card mb-4">
      <div class="card-header">Apariencia</div>
      <div class="card-body">
        <div class="mb-4">
          <div class="label mb-2">Tema</div>
          <div class="d-flex flex-wrap gap-2" id="grupo-tema">
            <button type="button" class="chip" data-valor="dark">Oscuro</button>
            <button type="button" class="chip" data-valor="light">Claro</button>
          </div>
        </div>
        <div>
          <div class="label mb-2">Tamaño de letra</div>
          <div class="d-flex flex-wrap gap-2" id="grupo-tamano">
            <button type="button" class="chip" data-valor="small">Pequeño</button>
            <button type="button" class="chip" data-valor="medium">Normal</button>
            <button type="button" class="chip" data-valor="large">Grande</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header">Cuenta</div>
      <div class="card-body">
        <div class="mb-3">
          <div class="label">Sesión iniciada como</div>
          <div id="perfil-email">—</div>
        </div>
        <button type="button" class="btn btn-outline-danger w-100" id="btn-logout">Cerrar sesión</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <a href="dashboard.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9v6M4 8v8M18 9v6M20 8v8M8 12h8"/></svg>
      <span>Hoy</span>
    </a>
    <a href="historial.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
      <span>Historial</span>
    </a>
    <a href="editor-rutina.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h2M9 6h11M4 12h2M9 12h11M4 18h2M9 18h11"/></svg>
      <span>Rutina</span>
    </a>
    <a href="progreso.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      <span>Progreso</span>
    </a>
    <a href="perfil.html" class="bottom-nav-item activo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.5-4 4.2-6 7-6s5.5 2 7 6"/></svg>
      <span>Perfil</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/perfil.js"></script>
</body>
</html>
