<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoy — App de Entrenamiento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container app-container">
      <span class="navbar-brand">Hoy</span>
      <div class="d-flex align-items-center gap-3">
        <span class="text-light small" id="user-email"></span>
        <button class="btn btn-sm btn-outline-light" id="btn-logout">Salir</button>
      </div>
    </div>
  </nav>

  <div class="app-container">
    <div class="alert alert-warning d-none" id="aviso-datos-referencia" role="alert">
      Mostrando la rutina de referencia local — todavía no hay datos en la base
      de datos para el día de hoy.
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="card-title h4" id="dia-nombre">—</h2>
        <p class="card-subtitle text-muted" id="dia-enfoque">—</p>
      </div>
    </div>

    <h3 class="h5">Ejercicios de hoy</h3>
    <ul class="list-group mb-4" id="lista-ejercicios"></ul>

    <button class="btn btn-primary w-100" id="btn-registrar">Registrar esta sesión</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/routine-data.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
