<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Restablecer contraseña — App de Entrenamiento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div class="text-center my-5">
      <h1 class="h3">Nueva contraseña</h1>
      <p class="text-muted">Elige una contraseña nueva para tu cuenta</p>
    </div>

    <div class="alert alert-danger d-none" id="mensaje-error" role="alert"></div>
    <div class="alert alert-success d-none" id="mensaje-exito" role="alert">Contraseña actualizada. Entrando…</div>
    <div class="alert alert-warning d-none" id="aviso-sin-token" role="alert">
      Este link no es válido o ya expiró. <a href="login.html">Pide uno nuevo desde el login</a>.
    </div>

    <form id="form-reset" class="d-none">
      <div class="mb-3">
        <label for="nueva-password" class="form-label">Contraseña nueva</label>
        <input type="password" class="form-control" id="nueva-password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="mb-3">
        <label for="confirmar-password" class="form-label">Confirmar contraseña</label>
        <input type="password" class="form-control" id="confirmar-password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary w-100" id="btn-guardar">Actualizar contraseña</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/reset-password.js"></script>
</body>
</html>
