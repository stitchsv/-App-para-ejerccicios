<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Progreso — App de Entrenamiento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container app-container flex-wrap">
      <a href="dashboard.html" class="navbar-brand">&larr; Hoy</a>
      <div class="d-flex align-items-center gap-3">
        <a href="historial.html" class="link-light small">Historial</a>
        <a href="editor-rutina.html" class="link-light small">Editor</a>
        <button class="btn btn-sm btn-outline-light" id="btn-logout">Salir</button>
      </div>
    </div>
  </nav>

  <div class="app-container">
    <h2 class="h4 mb-3">Progreso — fuerza por ejercicio</h2>

    <div class="mb-3">
      <label for="select-ejercicio" class="form-label">Ejercicio</label>
      <select class="form-select" id="select-ejercicio"></select>
    </div>

    <div class="alert alert-danger d-none" id="mensaje-error" role="alert"></div>
    <div class="alert alert-warning d-none" id="mensaje-sin-datos" role="alert">
      Todavía no hay series con peso registradas para este ejercicio.
    </div>

    <div class="card mb-3" id="card-chart">
      <div class="card-body">
        <div class="d-flex gap-4 mb-3">
          <div>
            <div class="label">PR</div>
            <div class="stat fs-4 fw-semibold" id="stat-pr">—</div>
          </div>
          <div>
            <div class="label">Última sesión</div>
            <div class="stat fs-4 fw-semibold" id="stat-ultima">—</div>
          </div>
        </div>
        <canvas id="chart-progreso" height="220"></canvas>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/progreso.js"></script>
</body>
</html>
