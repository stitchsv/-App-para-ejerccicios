<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Entrar — App de Entrenamiento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div class="text-center my-5">
      <h1 class="h3">App de Entrenamiento</h1>
      <p class="text-muted" id="form-subtitle">Inicia sesión para continuar</p>
    </div>

    <div class="alert alert-danger d-none" id="mensaje-error" role="alert"></div>

    <form id="form-login">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required autocomplete="email">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary w-100" id="btn-submit">Entrar</button>
    </form>

    <p class="text-center mt-3">
      <a href="#" id="toggle-modo">¿No tienes cuenta? Regístrate</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    let modoRegistro = false;

    const form = document.getElementById('form-login');
    const btnSubmit = document.getElementById('btn-submit');
    const toggle = document.getElementById('toggle-modo');
    const subtitle = document.getElementById('form-subtitle');
    const mensajeError = document.getElementById('mensaje-error');

    // Si ya hay sesión activa, saltar directo al dashboard.
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    })();

    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      modoRegistro = !modoRegistro;
      btnSubmit.textContent = modoRegistro ? 'Crear cuenta' : 'Entrar';
      subtitle.textContent = modoRegistro ? 'Crea tu cuenta' : 'Inicia sesión para continuar';
      toggle.textContent = modoRegistro ? '¿Ya tienes cuenta? Entra' : '¿No tienes cuenta? Regístrate';
      mensajeError.classList.add('d-none');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensajeError.classList.add('d-none');
      btnSubmit.disabled = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        if (modoRegistro) {
          await signup(email, password);
          mensajeError.classList.remove('d-none', 'alert-danger');
          mensajeError.classList.add('alert-success');
          mensajeError.textContent = 'Cuenta creada. Revisa tu email para confirmar (si aplica) e inicia sesión.';
        } else {
          await login(email, password);
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        mensajeError.classList.remove('d-none', 'alert-success');
        mensajeError.classList.add('alert-danger');
        mensajeError.textContent = err.message || 'Ocurrió un error.';
      } finally {
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
