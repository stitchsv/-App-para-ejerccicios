<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar sesión — App de Entrenamiento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container app-container">
      <a class="navbar-brand" href="dashboard.html">&larr; Hoy</a>
      <button class="btn btn-sm btn-outline-light" id="btn-logout">Salir</button>
    </div>
  </nav>

  <div class="app-container">
    <div class="mb-4">
      <h2 class="h4" id="dia-nombre">—</h2>
      <p class="text-muted" id="dia-enfoque">—</p>
    </div>

    <div class="alert alert-warning d-none" id="aviso-sin-datos" role="alert">
      Todavía no hay ejercicios cargados en la base de datos para hoy, así que
      no se puede guardar la sesión. Carga la rutina en Supabase (tablas
      <code>routine_days</code> / <code>routine_day_exercises</code> /
      <code>exercises</code>) y vuelve a intentarlo.
    </div>

    <div class="alert alert-danger d-none" id="mensaje-error" role="alert"></div>
    <div class="alert alert-success d-none" id="mensaje-exito" role="alert">Sesión guardada.</div>

    <form id="form-sesion">
      <div id="lista-ejercicios-form"></div>

      <div class="mb-3">
        <label for="energy-level" class="form-label">Nivel de energía</label>
        <select class="form-select" id="energy-level">
          <option value="">Sin dato</option>
          <option value="1">1 — muy baja</option>
          <option value="2">2 — baja</option>
          <option value="3">3 — normal</option>
          <option value="4">4 — buena</option>
          <option value="5">5 — muy buena</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="notas" class="form-label">Notas (contexto, ajustes del día, etc.)</label>
        <textarea class="form-control" id="notas" rows="2"></textarea>
      </div>

      <button type="submit" class="btn btn-primary w-100" id="btn-guardar">Guardar sesión</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/routine-data.js"></script>
  <script src="../js/registrar-sesion.js"></script>
</body>
</html>
