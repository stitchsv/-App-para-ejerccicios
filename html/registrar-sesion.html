<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Registrar sesión — App de Entrenamiento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <script>
    (function () {
      try {
        var tema = localStorage.getItem('pref-tema');
        var tamano = localStorage.getItem('pref-tamano-letra');
        if (tema === 'light') document.documentElement.setAttribute('data-theme', 'light');
        if (tamano && tamano !== 'medium') document.documentElement.setAttribute('data-font-size', tamano);
        document.documentElement.style.colorScheme = tema === 'light' ? 'light' : 'dark';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="app-topbar"><span class="app-topbar-title">Registrar sesión</span></header>

  <div class="app-container">
    <div class="mb-4">
      <h2 class="h4" id="dia-nombre">—</h2>
      <p class="text-muted" id="dia-enfoque">—</p>
    </div>

    <div class="alert alert-warning d-none" id="aviso-sin-datos" role="alert">
      Todavía no hay ejercicios cargados en la base de datos para hoy, así que
      no se puede guardar la sesión. Carga la rutina en Supabase (tablas
      <code>routine_days</code> / <code>routine_day_exercises</code> /
      <code>exercises</code>) y vuelve a intentarlo.
    </div>

    <div class="alert alert-danger d-none" id="mensaje-error" role="alert"></div>
    <div class="alert alert-success d-none" id="mensaje-exito" role="alert">Sesión guardada.</div>

    <form id="form-sesion">
      <div id="lista-ejercicios-form"></div>

      <div class="mb-3">
        <label for="energy-level" class="form-label">Nivel de energía</label>
        <select class="form-select" id="energy-level">
          <option value="">Sin dato</option>
          <option value="1">1 — muy baja</option>
          <option value="2">2 — baja</option>
          <option value="3">3 — normal</option>
          <option value="4">4 — buena</option>
          <option value="5">5 — muy buena</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="notas" class="form-label">Notas (contexto, ajustes del día, etc.)</label>
        <textarea class="form-control" id="notas" rows="2"></textarea>
      </div>

      <button type="submit" class="btn btn-primary w-100" id="btn-guardar">Guardar sesión</button>
    </form>
  </div>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <a href="dashboard.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9v6M4 8v8M18 9v6M20 8v8M8 12h8"/></svg>
      <span>Hoy</span>
    </a>
    <a href="historial.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
      <span>Historial</span>
    </a>
    <a href="editor-rutina.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h2M9 6h11M4 12h2M9 12h11M4 18h2M9 18h11"/></svg>
      <span>Rutina</span>
    </a>
    <a href="progreso.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      <span>Progreso</span>
    </a>
    <a href="perfil.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.5-4 4.2-6 7-6s5.5 2 7 6"/></svg>
      <span>Perfil</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/routine-data.js"></script>
  <script src="../js/registrar-sesion.js"></script>
</body>
</html>
