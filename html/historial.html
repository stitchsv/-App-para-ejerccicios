<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Historial — App de Entrenamiento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container app-container flex-wrap">
      <a href="dashboard.html" class="navbar-brand">&larr; Hoy</a>
      <div class="d-flex align-items-center gap-3">
        <a href="editor-rutina.html" class="link-light small">Editor</a>
        <button class="btn btn-sm btn-outline-light" id="btn-logout">Salir</button>
      </div>
    </div>
  </nav>

  <div class="app-container">
    <h2 class="h4 mb-3">Historial</h2>

    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-2">
          <div class="col-6 col-md-3">
            <label for="filtro-desde" class="form-label small">Desde</label>
            <input type="date" class="form-control form-control-sm" id="filtro-desde">
          </div>
          <div class="col-6 col-md-3">
            <label for="filtro-hasta" class="form-label small">Hasta</label>
            <input type="date" class="form-control form-control-sm" id="filtro-hasta">
          </div>
          <div class="col-6 col-md-3">
            <label for="filtro-dia" class="form-label small">Día de rutina</label>
            <select class="form-select form-select-sm" id="filtro-dia">
              <option value="">Todos</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label for="filtro-ejercicio" class="form-label small">Ejercicio</label>
            <select class="form-select form-select-sm" id="filtro-ejercicio">
              <option value="">Todos</option>
            </select>
          </div>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-primary btn-sm" id="btn-filtrar">Filtrar</button>
          <button class="btn btn-outline-secondary btn-sm" id="btn-limpiar">Limpiar filtros</button>
        </div>
      </div>
    </div>

    <div class="alert alert-danger d-none" id="mensaje-error" role="alert"></div>
    <div id="lista-sesiones"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/routine-data.js"></script>
  <script src="../js/historial.js"></script>
</body>
</html>
