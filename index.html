<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>App de Entrenamiento</title>
  <style>body { background: #18181b; }</style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    // Punto de entrada: redirige a dashboard si hay sesión activa, o a login si no.
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      window.location.replace(session ? 'html/dashboard.html' : 'html/login.html');
    })();
  </script>
</body>
</html>
